name: Instaladores Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Empaquetar Linux
    runs-on: ubuntu-latest
    concurrency:
      group: installers-linux
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libarchive-tools

      - name: Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y empaquetar
        run: npm run desktop:build

      - name: Instalar appimagetool
        run: |
          set -euo pipefail
          TOOLS="$(mktemp -d)"
          curl -fsSL -o "$TOOLS/appimagetool" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$TOOLS/appimagetool"
          "$TOOLS/appimagetool" --appimage-extract > /dev/null
          sudo install -m 0755 squashfs-root/AppRun /usr/local/bin/appimagetool
          rm -rf "$TOOLS" squashfs-root
          appimagetool --version || true

      - name: Añadir plugins de GStreamer al AppImage
        run: |
          set -euo pipefail
          # Tauri empaqueta el núcleo de GStreamer (libgstreamer 1.24) pero no sus
          # plugins, así que WebKitGTK se queda sin "autoaudiosink" y la app sale
          # muda. El runner es Ubuntu 24.04 (gst 1.24.2), exactamente la misma
          # versión, así que sus plugins son compatibles con el núcleo empaquetado.
          APPIMAGE="$(ls src-tauri/target/release/bundle/appimage/*.AppImage)"
          rm -rf AppDir
          "$APPIMAGE" --appimage-extract > /dev/null
          mv squashfs-root AppDir

          DEST="AppDir/usr/lib/gstreamer-1.0"
          mkdir -p "$DEST"
          SRC="/usr/lib/x86_64-linux-gnu/gstreamer-1.0"
          count=0
          for f in "$SRC"/*.so; do
            base="$(basename "$f")"
            cp -a "$f" "$DEST/" && count=$((count+1))
          done
          echo "plugins copiados: $count"
          # autoaudiosink no viene en un plugin propio: lo aporta libgstautodetect,
          # junto con la cadena mínima de audio.
          for req in libgstautodetect.so libgstpulseaudio.so libgstaudioconvert.so libgstaudioresample.so; do
            if [ ! -f "$DEST/$req" ]; then
              echo "::error::falta el plugin $req"
              exit 1
            fi
          done

      - name: Verificar que el AppImage encuentra autoaudiosink
        run: |
          set -euo pipefail
          # Reproducimos el fallo real dentro del propio AppDir: si gst-inspect no
          # ve autoaudiosink con las variables que fija AppRun, el AppImage
          # volverá a salir mudo.
          cd AppDir
          export LD_LIBRARY_PATH="$PWD/usr/lib:${LD_LIBRARY_PATH:-}"
          export GST_PLUGIN_SYSTEM_PATH="$PWD/usr/lib/gstreamer-1.0"
          export GST_PLUGIN_SYSTEM_PATH_1_0="$GST_PLUGIN_SYSTEM_PATH"
          export GST_REGISTRY="$PWD/gst-registry.bin"
          if gst-inspect-1.0 autoaudiosink > /dev/null 2>&1; then
            echo "OK: autoaudiosink disponible dentro del AppDir"
          else
            echo "::error::autoaudiosink sigue sin estar disponible en el AppDir"
            gst-inspect-1.0 autoaudiosink || true
            exit 1
          fi
          rm -f "$PWD/gst-registry.bin"
          cd ..

      - name: Reempaquetar AppImage
        env:
          ARCH: x86_64
        run: |
          set -euo pipefail
          # Sustituye el AppImage roto por uno que sí lleva los plugins.
          rm -f src-tauri/target/release/bundle/appimage/*.AppImage
          appimagetool --no-appstream AppDir \
            src-tauri/target/release/bundle/appimage/Aero.Rush-portable.AppImage
          ls -la src-tauri/target/release/bundle/appimage/
          rm -rf AppDir

      - name: Empaquetar versión portable (tar.xz)
        run: |
          set -euo pipefail
          # El .deb usa las librerías del sistema (WebKitGTK + GStreamer del
          # sistema), así que sirve tal cual para Arch/Fedora/openSUSE: lo
          # desempaquetamos y lo reempaquetamos como tarball con su .desktop
          # y sus iconos.
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/root"
          ar -x src-tauri/target/release/bundle/deb/*.deb --output "$STAGE"
          tar -xf "$STAGE"/data.tar.* -C "$STAGE/root" 2>/dev/null || (tar -xzf "$STAGE"/data.tar.gz -C "$STAGE/root" 2>/dev/null || tar -xf "$STAGE"/data.tar.xz -C "$STAGE/root")

          tar -cJf "$GITHUB_WORKSPACE/aero-rush-portable.tar.xz" -C "$STAGE/root" .
          rm -rf "$STAGE"
          tar -tJf "$GITHUB_WORKSPACE/aero-rush-portable.tar.xz" | head -20

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: aero-rush-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            aero-rush-portable.tar.xz
          if-no-files-found: error
