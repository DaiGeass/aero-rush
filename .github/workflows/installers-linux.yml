name: Instaladores Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Empaquetar Linux
    runs-on: ubuntu-latest
    concurrency:
      group: installers-linux
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y empaquetar
        run: npm run desktop:build

      - name: Empaquetar versión portable (tar.xz)
        run: |
          set -euo pipefail
          # El .deb usa las librerías del sistema (WebKitGTK + GStreamer del
          # sistema), así que sirve tal cual para Arch/Fedora/openSUSE: lo
          # desempaquetamos y lo reempaquetamos como tarball con su .desktop
          # y sus iconos.
          STAGE="$(mktemp -d)"
          bsdtar -xf src-tauri/target/release/bundle/deb/*.deb -C "$STAGE"
          mkdir -p "$STAGE/root"
          bsdtar -xf "$STAGE"/data.tar.* -C "$STAGE/root"
          tar -cJf "$GITHUB_WORKSPACE/aero-rush-portable.tar.xz" -C "$STAGE/root" .
          rm -rf "$STAGE"
          tar -tJf "$GITHUB_WORKSPACE/aero-rush-portable.tar.xz" | head -20

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: aero-rush-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            aero-rush-portable.tar.xz
          if-no-files-found: error
