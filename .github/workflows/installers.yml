name: Instaladores

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      solo_linux:
        description: "Solo compilar el AppImage/deb de Linux y no publicar nada"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Empaquetar ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows
    concurrency:
      # El grupo incluye la ref: si no, el push a main cancela el run del tag
      # que se lanzó en paralelo y la release se queda sin publicarse.
      group: installers-${{ matrix.artifact }}-${{ github.ref }}
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias del sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Rust estable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y empaquetar
        run: npm run desktop:build

      - name: Subir artefactos
        if: ${{ !inputs.solo_linux }}
        uses: actions/upload-artifact@v4
        with:
          name: aero-rush-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.solo_linux
    runs-on: ubuntu-latest
    steps:
      - name: Esperar y descargar los instaladores de Linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # El workflow de Linux corre en paralelo: esperamos su artefacto.
          for i in $(seq 1 90); do
            id=$(gh api "/repos/${{ github.repository }}/actions/artifacts?name=aero-rush-linux" \
                 --jq ".artifacts[] | select(.expired == false and .workflow_run.head_sha == \"${{ github.sha }}\") | .id" | head -1)
            if [ -n "$id" ]; then
              mkdir -p artefactos/linux
              gh api "/repos/${{ github.repository }}/actions/artifacts/$id/zip" > /tmp/linux.zip
              unzip -q /tmp/linux.zip -d artefactos/linux
              echo "Instaladores de Linux listos (artefacto $id)"
              ls -l artefactos/linux
              exit 0
            fi
            echo "Esperando el artefacto de Linux... ($i)"
            sleep 20
          done
          echo "::error::el workflow de Linux no publicó su artefacto"
          exit 1

      - name: Descargar instaladores de Windows
        uses: actions/download-artifact@v4
        with:
          name: aero-rush-windows
          path: artefactos/windows

      - name: Crear release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artefactos/**/*.exe
            artefactos/**/*.msi
            artefactos/**/*.deb
            artefactos/**/*.AppImage
            artefactos/**/*.tar.xz
          fail_on_unmatched_files: false
          generate_release_notes: true
