[package]
name = "aero-rush"
version = "1.0.3"
description = "Carreras 3D en estilo Frutiger Aero: cristal, burbujas, día y noche."
authors = ["Daigeass & GLP"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
